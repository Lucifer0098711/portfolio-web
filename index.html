<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Hero Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .hero-container {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text {
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1.4;
        }

        .rotating-word {
            display: inline-block;
            font-weight: 600;
            position: relative;
            height: 1.4em;
            vertical-align: bottom;
            overflow: hidden;
        }

        .word {
            position: absolute;
            opacity: 0;
            transform: translateY(100%);
            animation: rotateWord 9s infinite;
        }

        .word:nth-child(1) {
            animation-delay: 0s;
        }

        .word:nth-child(2) {
            animation-delay: 3s;
        }

        .word:nth-child(3) {
            animation-delay: 6s;
        }

        @keyframes rotateWord {
            0%, 33.33% {
                opacity: 1;
                transform: translateY(0);
            }
            36.33%, 100% {
                opacity: 0;
                transform: translateY(-100%);
            }
        }

        .hero-images {
            position: relative;
            height: 600px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.3s forwards;
        }

        .project-image {
            position: absolute;
            width: 400px;
            height: 500px;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .project-image:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .project-image:hover img {
            transform: scale(1.1);
        }

        .project-image-1 {
            top: 50px;
            left: 0;
            z-index: 2;
            animation: float1 6s ease-in-out infinite;
        }

        .project-image-2 {
            top: 80px;
            right: 0;
            z-index: 1;
            animation: float2 6s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-20px) rotate(-1deg);
            }
        }

        @keyframes float2 {
            0%, 100% {
                transform: translateY(0) rotate(2deg);
            }
            50% {
                transform: translateY(-15px) rotate(1deg);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 2rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-image:hover .project-overlay {
            opacity: 1;
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-description {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 1024px) {
            .hero-container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .hero-title {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 2rem;
            }

            .hero-images {
                height: 500px;
            }

            .project-image {
                width: 300px;
                height: 400px;
            }
        }

        @media (max-width: 640px) {
            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1.5rem;
            }

            .project-image {
                width: 250px;
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="hero-container">
            <div class="hero-text">
                <h1 class="hero-title">John Developer</h1>
                <p class="hero-subtitle">
                    Valuable, that is my
                    <span class="rotating-word">
                        <span class="word">expertise.</span>
                        <span class="word">creativity.</span>
                        <span class="word">passion.</span>
                    </span>
                </p>
            </div>

            <div class="hero-images">
                <a href="https://your-project-1.com" class="project-image project-image-1" target="_blank">
                    <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=800&h=1000&fit=crop" alt="Project 1">
                    <div class="project-overlay">
                        <div class="project-title">3D Portfolio Site</div>
                        <div class="project-description">Interactive 3D experience with WebGL</div>
                    </div>
                </a>

                <a href="https://your-project-2.com" class="project-image project-image-2" target="_blank">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&h=1000&fit=crop" alt="Project 2">
                    <div class="project-overlay">
                        <div class="project-title">E-Commerce Platform</div>
                        <div class="project-description">Modern shopping experience with React</div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
